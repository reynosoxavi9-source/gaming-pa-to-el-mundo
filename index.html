}

.contenido-portada {
  color: white;

}

}

.botones {
  display: flex;

  flex-wrap: wrap;
}

.botones button {
  padding: 15px 25px;
  border: 2px solid white;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.6);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.botones button:hover {

}
