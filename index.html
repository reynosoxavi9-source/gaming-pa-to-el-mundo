<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gaming Pa' To' El Mundo</title>

<meta name="google-site-verification"
content="tBjStkwmDHPS0n48PiBecGJwQj3FOFWd5lukZnJJDcw">

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 font-family:Arial,sans-serif;
 background:#111;
 color:white;
 overflow-x:hidden;
}

button{
 cursor:pointer;
}

/* PORTADA */

.portada{
 min-height:100vh;
 width:100%;
 background:
 linear-gradient(
  rgba(0,0,0,.35),
  rgba(0,0,0,.65)
 ),
 url("portada.png") center/cover no-repeat;

 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
}

.contenido-portada{
 width:100%;
 padding:260px 20px 80px;
}

.contenido-portada h1{
 font-size:clamp(35px,7vw,75px);
 text-shadow:0 5px 20px #000;
 margin-bottom:30px;
}

.botones{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:15px;
}

.botones button{
 padding:15px 25px;
 border:none;
 border-radius:12px;
 background:#fff;
 color:#111;
 font-size:17px;
 font-weight:bold;
 transition:.2s;
}

.botones button:hover{
 transform:scale(1.07);
}

/* CONTADOR */

.contador-visitas{
 margin:30px auto 0;
 padding:15px 25px;
 width:max-content;
 max-width:90%;
 border-radius:15px;
 background:rgba(0,0,0,.75);
 text-align:center;
 box-shadow:0 0 20px rgba(255,255,255,.15);
}

.contador-visitas span{
 display:block;
 margin-top:5px;
 font-size:30px;
 font-weight:bold;
 letter-spacing:4px;
}

/* JUEGOS */

#juegos{
 padding:60px 20px;
 background:#111;
}

#juegos h2{
 text-align:center;
 font-size:40px;
 margin-bottom:40px;
}

.lista-juegos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
 gap:25px;
 max-width:1200px;
 margin:auto;
}

.juego{
 background:#1d1d1d;
 border-radius:20px;
 padding:25px;
 text-align:center;
 box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.juego h3{
 margin-bottom:15px;
 font-size:25px;
}

.juego button{
 border:none;
 border-radius:10px;
 padding:12px 22px;
 font-weight:bold;
 background:white;
 color:#111;
}

/* FOOTBALL */

.cancha{
 width:100%;
 max-width:500px;
 height:300px;
 margin:20px auto;
 background:#16833a;
 border:5px solid white;
 border-radius:10px;
 position:relative;
 overflow:hidden;
}

.jugador{
 width:30px;
 height:30px;
 border-radius:50%;
 background:#2196f3;
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
}

.balon{
 width:20px;
 height:20px;
 border-radius:50%;
 background:white;
 position:absolute;
 left:50%;
 top:40%;
 transform:translate(-50%,-50%);
}

/* SNAKE */

#snakeCanvas{
 background:#000;
 border:3px solid white;
 max-width:100%;
}

/* BREAKOUT */

#breakoutCanvas{
 background:#050505;
 border:3px solid white;
 max-width:100%;
}

/* CARRERA */

.carrera{
 width:100%;
 max-width:400px;
 height:500px;
 margin:20px auto;
 background:#333;
 border:5px solid white;
 position:relative;
 overflow:hidden;
}

.carro{
 position:absolute;
 bottom:30px;
 left:50%;
 transform:translateX(-50%);
 width:45px;
 height:75px;
 background:red;
 border-radius:10px;
}

.obstaculo{
 position:absolute;
 width:45px;
 height:75px;
 background:yellow;
 border-radius:10px;
 top:-100px;
}

/* MOBILE */

@media(max-width:600px){

 .contenido-portada{
  padding-top:140px;
 }

 .contenido-portada h1{
  font-size:40px;
 }

 .botones button{
  width:80%;
 }

 #juegos h2{
  font-size:32px;
 }

}

</style>
</head>

<body>

<!-- PORTADA -->

<section class="portada">

 <div class="contenido-portada">

  <h1>🎮 Gaming Pa' To' El Mundo</h1>

  <div class="botones">

   <button onclick="irAJuegos()">🎮 JUGAR</button>

   <button onclick="irAJuegos()">🕹️ JUEGOS</button>

   <button onclick="irAJuegos()">⭐ FAVORITOS</button>

   <button onclick="irAJuegos()">📂 CATEGORÍAS</button>

  </div>

  <div class="contador-visitas">

   <div>👀 VISITAS</div>

   <span id="contador">000000</span>

  </div>

 </div>

</section>


<!-- JUEGOS -->

<section id="juegos">

 <h2>🔥 Juegos</h2>

 <div class="lista-juegos">

  <!-- FÚTBOL -->

  <div class="juego">

   <h3>⚽ Fútbol Pa' To'</h3>

   <div class="cancha" id="cancha">

    <div class="jugador" id="jugador"></div>

    <div class="balon" id="balon"></div>

   </div>

   <button onclick="disparar()">⚽ ¡Patear!</button>

  </div>


  <!-- SNAKE -->

  <div class="juego">

   <h3>🐍 Snake</h3>

   <canvas
    id="snakeCanvas"
    width="280"
    height="280">
   </canvas>

   <br><br>

   <button onclick="iniciarSnake()">
    ▶️ Jugar Snake
   </button>

  </div>


  <!-- BREAKOUT -->

  <div class="juego">

   <h3>🧱 Rompe Bloques</h3>

   <canvas
    id="breakoutCanvas"
    width="300"
    height="250">
   </canvas>

   <br><br>

   <button onclick="iniciarBreakout()">
    ▶️ Jugar
   </button>

  </div>


  <!-- CARRERA -->

  <div class="juego">

   <h3>🏎️ Carrera</h3>

   <div class="carrera" id="carrera">

    <div class="carro" id="carro"></div>

    <div
     class="obstaculo"
     id="obstaculo">
    </div>

   </div>

   <button onclick="iniciarCarrera()">
    🏁 Jugar Carrera
   </button>

  </div>

 </div>

</section>


<script>

/* IR A JUEGOS */

function irAJuegos(){

 document
  .getElementById("juegos")
  .scrollIntoView({
   behavior:"smooth"
  });

}


/* =========================
   CONTADOR GLOBAL
========================= */

const URL_CONTADOR =
 "https://gaming-visitas.reynosoxavi9.workers.dev/visita";

async function cargarVisitas(){

 try{

  const respuesta =
   await fetch(URL_CONTADOR);

  const datos =
   await respuesta.json();

  const visitas =
   datos.data?.up_count ?? 0;

  document
   .getElementById("contador")
   .textContent =
   String(visitas).padStart(6,"0");

 }catch(error){

  console.log(
   "Error cargando visitas:",
   error
  );

 }

}


async function sumarVisitaUnaVez(){

 const yaContada =
  localStorage.getItem(
   "visitaContadaGaming"
  );

 if(!yaContada){

  try{

   const respuesta =
    await fetch(URL_CONTADOR);

   if(respuesta.ok){

    localStorage.setItem(
     "visitaContadaGaming",
     "true"
    );

   }

  }catch(error){

   console.log(
    "Error sumando visita:",
    error
   );

  }

 }

 cargarVisitas();

}

sumarVisitaUnaVez();


/* =========================
   FÚTBOL
========================= */

const jugador =
 document.getElementById("jugador");

const cancha =
 document.getElementById("cancha");

let jugadorX = 50;
let jugadorY = 50;

function moverJugador(x,y){

 jugadorX = Math.max(5,Math.min(95,x));
 jugadorY = Math.max(5,Math.min(95,y));

 jugador.style.left =
  jugadorX + "%";

 jugador.style.top =
  jugadorY + "%";

}

cancha.addEventListener(
 "mousemove",
 function(e){

  const rect =
   cancha.getBoundingClientRect();

  const x =
   ((e.clientX-rect.left)/rect.width)*100;

  const y =
   ((e.clientY-rect.top)/rect.height)*100;

  moverJugador(x,y);

 }
);


cancha.addEventListener(
 "touchmove",
 function(e){

  e.preventDefault();

  const touch =
   e.touches[0];

  const rect =
   cancha.getBoundingClientRect();

  const x =
   ((touch.clientX-rect.left)/rect.width)*100;

  const y =
   ((touch.clientY-rect.top)/rect.height)*100;

  moverJugador(x,y);

 },
 {passive:false}
);


function disparar(){

 const balon =
  document.getElementById("balon");

 balon.style.left =
  jugadorX + "%";

 balon.style.top =
  jugadorY + "%";

}


/* =========================
   SNAKE
========================= */

let snakeInterval;

function iniciarSnake(){

 clearInterval(snakeInterval);

 const canvas =
  document.getElementById("snakeCanvas");

 const ctx =
  canvas.getContext("2d");

 const tamaño = 20;

 let snake=[
  {x:140,y:140},
  {x:120,y:140},
  {x:100,y:140}
 ];

 let comida={
  x:Math.floor(Math.random()*14)*20,
  y:Math.floor(Math.random()*14)*20
 };

 let dx=20;
 let dy=0;

 document.onkeydown=function(e){

  if(e.key==="ArrowUp" && dy===0){
   dx=0;
   dy=-20;
  }

  if(e.key==="ArrowDown" && dy===0){
   dx=0;
   dy=20;
  }

  if(e.key==="ArrowLeft" && dx===0){
   dx=-20;
   dy=0;
  }

  if(e.key==="ArrowRight" && dx===0){
   dx=20;
   dy=0;
  }

 };

 snakeInterval=setInterval(function(){

  const cabeza={
   x:snake[0].x+dx,
   y:snake[0].y+dy
  };

  if(
   cabeza.x<0 ||
   cabeza.y<0 ||
   cabeza.x>=280 ||
   cabeza.y>=280
  ){

   clearInterval(snakeInterval);
   alert("💀 Perdiste en Snake");
   return;

  }

  snake.unshift(cabeza);

  if(
   cabeza.x===comida.x &&
   cabeza.y===comida.y
  ){

   comida={
    x:Math.floor(Math.random()*14)*20,
    y:Math.floor(Math.random()*14)*20
   };

  }else{

   snake.pop();

  }

  ctx.clearRect(
   0,
   0,
   280,
   280
  );

  ctx.fillStyle="red";

  ctx.fillRect(
   comida.x,
   comida.y,
   tamaño,
   tamaño
  );

  ctx.fillStyle="lime";

  snake.forEach(function(parte){

   ctx.fillRect(
    parte.x,
    parte.y,
    tamaño-2,
    tamaño-2
   );

  });

 },120);

}


/* =========================
   BREAKOUT
========================= */

let breakoutInterval;

function iniciarBreakout(){

 clearInterval(breakoutInterval);

 const canvas =
  document.getElementById(
   "breakoutCanvas"
  );

 const ctx =
  canvas.getContext("2d");

 let x=150;
 let y=220;

 let dx=3;
 let dy=-3;

 let paddleX=120;

 const paddleWidth=60;
 const paddleHeight=10;

 let bricks=[];

 for(let fila=0;fila<4;fila++){

  for(let col=0;col<7;col++){

   bricks.push({
    x:col*42+3,
    y:fila*25+10,
    w:38,
    h:18,
    vivo:true
   });

  }

 }

 document.onmousemove=function(e){

  const rect =
   canvas.getBoundingClientRect();

  paddleX =
   e.clientX -
   rect.left -
   paddleWidth/2;

 };

 breakoutInterval=setInterval(function(){

  ctx.clearRect(
   0,
   0,
   canvas.width,
   canvas.height
  );

  x+=dx;
  y+=dy;

  if(x<0 || x>canvas.width){
   dx*=-1;
  }

  if(y<0){
   dy*=-1;
  }

  if(
   y>canvas.height
  ){

   clearInterval(
    breakoutInterval
   );

   alert("💥 Perdiste");
   return;

  }

  if(
   y+10>=canvas.height-25 &&
   x>=paddleX &&
   x<=paddleX+paddleWidth
  ){

   dy=-Math.abs(dy);

  }

  bricks.forEach(function(b){

   if(
    b.vivo &&
    x>b.x &&
    x<b.x+b.w &&
    y>b.y &&
    y<b.y+b.h
   ){

    b.vivo=false;
    dy*=-1;

   }

  });

  ctx.fillStyle="white";

  ctx.fillRect(
   x,
   y,
   10,
   10
  );

  ctx.fillRect(
   paddleX,
   canvas.height-20,
   paddleWidth,
   paddleHeight
  );

  ctx.fillStyle="cyan";

  bricks.forEach(function(b){

   if(b.vivo){

    ctx.fillRect(
     b.x,
     b.y,
     b.w,
     b.h
    );

   }

  });

 },16);

}


/* =========================
   CARRERA
========================= */

let carreraInterval;

function iniciarCarrera(){

 clearInterval(carreraInterval);

 const carrera =
  document.getElementById("carrera");

 const carro =
  document.getElementById("carro");

 const obstaculo =
  document.getElementById(
   "obstaculo"
  );

 let posicion=50;
 let obstaculoY=-100;

 function mover(){

  carro.style.left =
   posicion + "%";

 }

 document.onkeydown=function(e){

  if(e.key==="ArrowLeft"){
   posicion-=5;
  }

  if(e.key==="ArrowRight"){
   posicion+=5;
  }

  posicion=Math.max(
   10,
   Math.min(90,posicion)
  );

  mover();

 };

 carrera.addEventListener(
  "touchmove",
  function(e){

   e.preventDefault();

   const rect =
    carrera.getBoundingClientRect();

   const touch =
    e.touches[0];

   posicion =
    ((touch.clientX-rect.left)/
    rect.width)*100;

   posicion=Math.max(
    10,
    Math.min(90,posicion)
   );

   mover();

  },
  {passive:false}
 );

 carreraInterval=setInterval(function(){

  obstaculoY+=5;

  if(obstaculoY>500){

   obstaculoY=-100;

   obstaculo.style.left =
    (10+Math.random()*80)+"%";

  }

  obstaculo.style.top =
   obstaculoY+"px";

 },30);

 mover();

}

</script>

</body>
</html>
